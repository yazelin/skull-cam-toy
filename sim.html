<script>
// ================= 出事要講話,不要黑畫面 =================
const view = document.getElementById('view');
function fatal(msg,detail){
  view.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">'+
   '<div style="max-width:560px;border:1px solid #ff6b6b;border-radius:10px;padding:20px 22px;background:#241a1c;line-height:1.8">'+
   '<div style="color:#ff6b6b;font-weight:600;margin-bottom:8px">'+msg+'</div>'+
   '<div style="font-size:12px;color:#c9b4a0;white-space:pre-wrap">'+(detail||'')+'</div></div></div>';
}
addEventListener('error',e=>fatal('載入時出錯',(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||'')));
if(typeof THREE==='undefined'){
  fatal('three.min.js 沒載進來',
    '瀏覽器把同資料夾的 script 擋掉了(file:// 常見)。\n\n改用本機網址開:\n    http://127.0.0.1:8099/\n\n'+
    '或換 Firefox / google-chrome 開同一個檔案。');
  throw new Error('no THREE');
}
let renderer, NO3D=false;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
}catch(err){
  NO3D=true;
  // 3D 掛了也不要整頁陣亡:塞一個假 renderer,右邊面板照常算、照常切模式
  renderer={domElement:document.createElement('canvas'),setPixelRatio(){},setSize(){},render(){}};
  fatal('這台機器的瀏覽器開不了 WebGL —— 3D 看不到,右邊的檢查數字仍然有效',
    String(err)+'\n\n到 chrome://gpu 看 WebGL 是不是 Disabled。\n混合顯卡常見解法:\n'+
    '  google-chrome --enable-unsafe-swiftshader http://127.0.0.1:8099/\n'+
    '或改用 Firefox 開同一個網址。');
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
if(!NO3D) view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 500, 1400);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 3000);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2418, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(220,420,320); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35); fill.position.set(-260,140,-180); scene.add(fill);
const front = new THREE.DirectionalLight(0xfff2e0, 0.55); front.position.set(40,180,-420); scene.add(front);

// 地面格線
const grid = new THREE.GridHelper(900, 30, 0x2a2f3a, 0x21252e);
grid.position.set(90,-3.2,57); scene.add(grid);

// 手轉軌道控制(自製,免額外檔案)
const orbit = {t:new THREE.Vector3(90,95,57), r:430, th:-0.62, ph:1.15};
function applyCam(){
  camera.position.set(
    orbit.t.x + orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),
    orbit.t.y + orbit.r*Math.cos(orbit.ph),
    orbit.t.z + orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th));
  camera.lookAt(orbit.t);
}
(function(){
  let down=null;
  const el = renderer.domElement;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,b:e.button};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointerup',e=>{down=null});
  el.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-down.x, dy=e.clientY-down.y; down.x=e.clientX; down.y=e.clientY;
    if(down.b===2){
      const s=orbit.r*0.0016;
      const right=new THREE.Vector3().subVectors(camera.position,orbit.t).cross(new THREE.Vector3(0,1,0)).normalize();
      orbit.t.addScaledVector(right,-dx*s); orbit.t.y += dy*s;
    }else{
      orbit.th -= dx*0.006;
      orbit.ph = Math.max(0.12, Math.min(Math.PI-0.12, orbit.ph - dy*0.006));
    }
    applyCam();
  });
  el.addEventListener('wheel',e=>{e.preventDefault();orbit.r=Math.max(90,Math.min(1400,orbit.r*(1+Math.sign(e.deltaY)*0.11)));applyCam()},{passive:false});
})();
function resize(){
  const w=view.clientWidth||800,h=view.clientHeight||600;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

// ================= 建模小工具 =================
// 世界對應:three.x = 機構 x(左右) / three.y = 機構 z(上下) / three.z = 機構 y(前後)
const MAT = {
  ply:      new THREE.MeshStandardMaterial({color:0xd9b382,roughness:.85,metalness:.02}),
  plyDark:  new THREE.MeshStandardMaterial({color:0xb08654,roughness:.85,metalness:.02}),
  shell:    new THREE.MeshStandardMaterial({color:0xc9a273,roughness:.9,transparent:true,opacity:.22,side:THREE.DoubleSide}),
  cam:      new THREE.MeshStandardMaterial({color:0xe4713a,roughness:.55,metalness:.1}),
  cam2:     new THREE.MeshStandardMaterial({color:0xf2a03d,roughness:.55,metalness:.1}),
  rod:      new THREE.MeshStandardMaterial({color:0x7aa2f7,roughness:.5,metalness:.15}),
  steel:    new THREE.MeshStandardMaterial({color:0xa8b0bd,roughness:.35,metalness:.7}),
  bone:     new THREE.MeshStandardMaterial({color:0xf0ece0,roughness:.75}),
  jaw:      new THREE.MeshStandardMaterial({color:0xe2d9c4,roughness:.75}),
  eye:      new THREE.MeshStandardMaterial({color:0x2fd6a5,roughness:.3,emissive:0x0d5b45}),
  bad:      new THREE.MeshStandardMaterial({color:0xff5252,roughness:.4,emissive:0x5a0000}),
  turn:     new THREE.MeshStandardMaterial({color:0xc678dd,roughness:.5}),
};
function rect(x0,y0,x1,y1){return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];}
function mkShape(pts,holes){
  const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  (holes||[]).forEach(h=>{const p=new THREE.Path(h.map(q=>new THREE.Vector2(q[0],q[1])));s.holes.push(p);});
  return s;
}
function circPts(cx,cy,r,n){const a=[];for(let i=0;i<(n||28);i++){const t=i/(n||28)*Math.PI*2;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return a;}
function extrude(shape,t){return new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false});}
// ---- 木片登記簿:每片板記下「2D 外形 + 孔 + 厚度」,供干涉掃描用 ----
// 板的局部立體 = (u,v) 落在外形內、不落在任何孔內,且 0<=w<=t
const SOLIDS=[]; let PART='?';
function reg(m,pts,holes,t,w0){ SOLIDS.push({part:PART,mesh:m,poly:pts,holes:holes||[],t:t,w0:w0||0}); return m; }
// 板面法線沿 y(前後)—— 形狀畫在 (x,z)
function plateXZ(pts,t,y0,mat,holes){
  const m=new THREE.Mesh(extrude(mkShape(pts,holes),t),mat||MAT.ply); m.position.z=y0;
  return reg(m,pts,holes,t);
}
// 板面法線沿 x(左右)—— 形狀畫在 (y,z)
function plateYZ(pts,t,x0,mat,holes){
  const m=new THREE.Mesh(extrude(mkShape(pts,holes),t),mat||MAT.ply);
  m.rotation.y=-Math.PI/2; m.position.x=x0+t; return reg(m,pts,holes,t);
}
// 水平板 —— 形狀畫在 (x,y)
function plateXY(pts,t,z0,mat,holes){
  const m=new THREE.Mesh(extrude(mkShape(pts,holes),t),mat||MAT.ply);
  m.rotation.x=Math.PI/2; m.position.y=z0+t; return reg(m,pts,holes,t);
}
// 方料:用同一套擠出表示,干涉掃描才吃得到
function box(w,d,h,x,y,z,mat){ // 中心座標
  return plateXY(rect(x-w/2,y-d/2,x+w/2,y+d/2),h,z-h/2,mat);
}
function rodX(r,len,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20),mat||MAT.steel);
  m.rotation.z=Math.PI/2; m.position.set(x,z,y); return m;
}
function rodZ(r,len,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20),mat||MAT.steel);
  m.position.set(x,z,y); return m;
}
function rodY(r,len,x,y,z,mat){   // 沿前後方向的銷
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20),mat||MAT.steel);
  m.rotation.x=Math.PI/2; m.position.set(x,z,y); return m;
}
const EDGE=new THREE.LineBasicMaterial({color:0x6b7385});
function withEdges(mesh){ // 讓透明外殼看得出輪廓
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,25),EDGE));
  return mesh;
}

// 凸輪:輪廓畫在 (y,z) 平面,厚 3,掛在會繞世界 X 轉的 group 上
function camGroup(profilePts,x,shaftY,shaftZ,mat){
  const g=new THREE.Group(); g.position.set(x,shaftZ,shaftY);
  const holes=[circPts(0,0,3,20).reverse()];
  const m=new THREE.Mesh(extrude(mkShape(profilePts,holes),3),mat||MAT.cam);
  m.rotation.y=-Math.PI/2; m.position.x=1.5;
  g.add(m); reg(m,profilePts,holes,3); return g;
}
// 把一個軸對齊矩形沿著多邊形的上緣或下緣併進去 → 一片零件,不是黏三片
function addRect(poly,x0,x1,zTo,side){
  const pick=xq=>{let best=null;
    for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];
      if((a[0]-xq)*(b[0]-xq)<0){const t=(xq-a[0])/(b[0]-a[0]),z=a[1]+t*(b[1]-a[1]);
        if(!best||(side==='bottom'?z<best.z:z>best.z)) best={i,z};}}
    return best;};
  const A=pick(x0),B=pick(x1);
  if(!A||!B) throw new Error('addRect 找不到交點 '+x0+' '+x1);
  const run=(f,t)=>{const r=[];for(let k=(f+1)%poly.length;k!==(t+1)%poly.length;k=(k+1)%poly.length)r.push(poly[k]);return r;};
  const zs=poly.map(p=>p[1]),zmid=(Math.min(...zs)+Math.max(...zs))/2;
  const seg=run(A.i,B.i);
  const hit=seg.length?((seg.reduce((s,p)=>s+p[1],0)/seg.length<zmid)===(side==='bottom')):true;
  return hit ? [[x0,A.z],[x0,zTo],[x1,zTo],[x1,B.z]].concat(run(B.i,A.i))
             : [[x1,B.z],[x1,zTo],[x0,zTo],[x0,A.z]].concat(run(A.i,B.i));
}
function eccPts(R,e,n){ // 偏心圓:圓心在 (0,e)
  const a=[];for(let i=0;i<(n||48);i++){const t=i/(n||48)*Math.PI*2;a.push([R*Math.cos(t),e+R*Math.sin(t)]);}return a;
}

// ================= 修正版 v2 =================
function buildV2(){
  const G=new THREE.Group(); const A={};
  const B=V2.box, T=B.t, TOPZ=B.h;
  const finSlots=V2.fins.map(([x,y0,y1])=>rect(x-1.7,y0-0.2,x+1.7,y1+0.2).reverse());                      // 頂板底面 z=90
  // 盒體
  PART='底板';
  G.add(plateXY(rect(0,0,B.w,B.d),T,-T,MAT.plyDark,finSlots));  // 底板(含導片榫孔)
  PART='前板';
  G.add(withEdges(plateXZ(rect(0,0,B.w,B.h),T,0,MAT.shell)));          // 前板
  PART='後板';
  G.add(withEdges(plateXZ(rect(0,0,B.w,B.h),T,B.d-T,MAT.shell)));      // 後板
  const AX=[circPts(V2.shaftY,V2.shaftZ,3.2,24).reverse()];            // Ø6.4 軸孔
  PART='左側板';
  G.add(withEdges(plateYZ(rect(T,0,B.d-T,B.h),T,0,MAT.shell,AX)));
  PART='右側板';
  G.add(withEdges(plateYZ(rect(T,0,B.d-T,B.h),T,B.w-T,MAT.shell,AX)));
  PART='軸承塊';   // 24×16,貼在側板內側,把軸承長度加到 9mm
  const BB=[[V2.shaftY-12,V2.shaftZ-8,V2.shaftY+12,V2.shaftZ+8]];
  BB.forEach(([a,b,c,d])=>{G.add(plateYZ(rect(a,b,c,d),6,T,MAT.plyDark,AX));
                           G.add(plateYZ(rect(a,b,c,d),6,B.w-T-6,MAT.plyDark,AX));});
  // 頂板(含導槽)
  const NX=V2.neck.x, NY=V2.neck.y;
  const rodSlots=[V2.rodX.eye,V2.rodX.jaw].map(x=>rect(x-3.6,V2.shankY.lo-2,x+3.6,V2.shankY.hi+2).reverse());
  const turnSlot=rect(V2.turnPlate.x-3.6,V2.turnPlate.y0-1,V2.turnPlate.x+3.6,V2.turnPlate.y1+1).reverse();
  const neckHoleTop=circPts(NX,NY,10.3,30).reverse();          // 轉盤凸台就坐在這個孔裡
  const neckHoleGuide=rect(NX-5.8,NY-5.0,NX+5.8,NY+5.0).reverse();
  PART='頂板';
  G.add(withEdges(plateXY(rect(0,0,B.w,B.d),T,TOPZ,MAT.shell,rodSlots.concat([turnSlot,neckHoleTop]))));
  PART='中段導板';
  G.add(plateXY(rect(6,V2.rodY.lo-2,118,V2.shankY.hi+4),T,V2.guide.z,MAT.shell,
    rodSlots.concat([neckHoleGuide],finSlots)));
  PART='轉頭導片';   // 兩塊夾片黏在頂板下,給轉頭板 22mm 深的導引通道
  G.add(plateYZ(rect(58,66,86,79),3,V2.turnPlate.x-5,MAT.shell));
  G.add(plateYZ(rect(58,66,86,79),3,V2.turnPlate.x+2,MAT.shell));

  // 凸輪軸 + 曲柄
  A.shaft=new THREE.Group(); A.shaft.position.set(0,V2.shaftZ,V2.shaftY); G.add(A.shaft);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(3,3,215,20),MAT.steel);
  sh.rotation.z=Math.PI/2; sh.position.x=92; A.shaft.add(sh);
  PART='曲柄臂';
  const crank=plateYZ(rect(-8,-8,8,54),6,-22,MAT.plyDark,[circPts(0,0,3,18).reverse(),circPts(0,46,4,18).reverse()]);
  A.shaft.add(crank);
  const knob=rodX(6,26,-32,0,46,MAT.plyDark); A.shaft.add(knob);
  PART='軸環';   // 板材圓片,黏在軸上抵住側板外側
  [-3,180].forEach(x=>A.shaft.add(plateYZ(circPts(0,0,7,26),3,x,MAT.plyDark,[circPts(0,0,3.1,20).reverse()])));

  // 四片凸輪
  A.cams={};
  PART='眼球凸輪';
  A.cams.eye =camGroup(PROFILES.cam4,V2.cams.eye.x, V2.shaftY,V2.shaftZ,MAT.cam2); G.add(A.cams.eye);
  PART='下顎凸輪';
  A.cams.jaw =camGroup(PROFILES.cam1,V2.cams.jaw.x, V2.shaftY,V2.shaftZ); G.add(A.cams.jaw);
  PART='轉頭凸輪';
  A.cams.turn=camGroup(eccPts(20,8),  V2.cams.turn.x,V2.shaftY,V2.shaftZ,MAT.turn); G.add(A.cams.turn);
  PART='點頭凸輪';
  A.cams.nod =camGroup(eccPts(12,4),  V2.cams.nod.x, V2.shaftY,V2.shaftZ); G.add(A.cams.nod);

  // 推桿:腳(寬,跨凸輪) + 桿身(窄,在頭部後方)
  function pusher(x,len,mat){
    const g=new THREE.Group();
    const foot=[[V2.rodY.lo,0],[V2.rodY.hi,0],[V2.rodY.hi,len],
                [V2.shankY.lo,len],[V2.shankY.lo,6],[V2.rodY.lo,6]];
    g.add(plateYZ(foot,6,x-3,mat||MAT.rod));
    return g;
  }
  PART='眼球推桿';
  A.eyeRod=pusher(V2.rodX.eye,V2.eyeRodLen); G.add(A.eyeRod);
  PART='下顎推桿';
  A.jawRod=pusher(V2.rodX.jaw,V2.jawRodLen); G.add(A.jawRod);

  // 轉頭斜槽板(45° 斜槽)
  const tp=V2.turnPlate, sw=2.6, H=tp.forkH;
  const sz0=V2.turntable.pinZ-64, sz1=V2.turntable.pinZ-48;
  const sy0=sz0+tp.slotC, sy1=sz1+tp.slotC;
  const slot=[[sy0-sw,sz0+sw],[sy1-sw,sz1+sw],[sy1+sw,sz1-sw],[sy0+sw,sz0-sw]];
  // C 形叉口:上下兩條平行邊夾住 Ø40 偏心圓 → 上下都是強制驅動,不靠重力
  const fk=0.2-20, fork=[[tp.y0,-42],[tp.y1,-42],[tp.y1,40],[tp.y0,40],
              [tp.y0,fk+H/2],[tp.forkY,fk+H/2],[tp.forkY,fk-H/2],[tp.y0,fk-H/2]];
  A.turnPlate=new THREE.Group();
  PART='轉頭叉口板';
  A.turnPlate.add(plateYZ(fork,3,tp.x-1.5,MAT.turn,[slot.reverse()]));
  G.add(A.turnPlate);

  // 升降板(讓位缺口 + 頸脊孔)
  const L=V2.lift;
  A.lift=new THREE.Group();
  PART='點頭升降板';
  A.lift.add(plateXY(rect(L.x0,L.y0,L.x1,L.y1),L.t,0,MAT.plyDark,
    [neckHoleGuide].concat(V2.fins.map(([x,y0,y1])=>rect(x-1.9,y0-0.4,x+1.9,y1+0.4).reverse()))));
  G.add(A.lift);
  // 兩片導片(板材卡榫):下端插底板、上端插中段導板;封閉長槽同時定住 x、y 與旋轉
  PART='升降導片';
  V2.fins.forEach(([x,y0,y1])=>G.add(plateYZ(rect(y0,-3,y1,73),3,x-1.5,MAT.plyDark)));

  // 頸脊(8 寬 × 6 厚的扁棒,站在頭部後方)+ 底部項圈
  A.neck=new THREE.Group(); A.neck.position.set(NX,0,NY);
  PART='頸脊';
  A.neck.add(box(V2.neck.w,V2.neck.d,110,0,0,58,MAT.plyDark));
  PART='頸脊項圈';
  A.neck.add(box(16,14,3,0,0,1.5,MAT.plyDark));   // 項圈縮小,讓開導片
  G.add(A.neck);

  // 轉盤:方孔 hub 套住頸脊(可上下滑、不能相對轉)+ 臂 + 銷
  A.tt=new THREE.Group(); A.tt.position.set(NX,0,NY);
  const sq=[rect(-4.3,-3.3,4.3,3.3).reverse()];
  PART='轉盤組';
  A.tt.add(plateXY(rect(8,-3.5,26,3.5),3,81,MAT.turn));   // 撥臂(只到半徑 26,不進斜槽)
  A.tt.add(plateXY(circPts(0,0,15,32),3,84,MAT.turn,sq));                   // 下盤(頂板下)
  A.tt.add(plateXY(circPts(0,0,10,28),6,87,MAT.turn,sq));                   // 凸台(穿頂板 Ø20.6 孔)
  A.tt.add(plateXY(circPts(0,0,15,32),3,93,MAT.turn,sq));                   // 壓片(頂板上)→ 軸向被夾住
  A.tt.add(rodX(2,20,V2.turntable.armR-2,0,V2.turntable.pinZ));             // 撥銷 Ø4,穿過斜槽
  G.add(A.tt);

  // ---- 頭部 ----
  A.headPivot=new THREE.Group(); A.headPivot.position.set(NX,0,NY); G.add(A.headPivot);
  A.headLift=new THREE.Group(); A.headPivot.add(A.headLift);
  const S=V2.head, ox=S.sx-42-NX, oz=S.z0-9;               // 頭骨局部→頭部座標
  const skullPts=PROFILES.skull.map(p=>[p[0]+ox, p[1]+oz]);
  const holes=[circPts(30+ox,66+oz,V2.socketR,26).reverse(),circPts(54+ox,66+oz,V2.socketR,26).reverse(),
               [[42+ox,55+oz],[48+ox,44+oz],[36+ox,44+oz]]];          // 兩眼窩 + 鼻孔
  PART='頭骨主片';
  V2.jawPin.x.forEach(x=>holes.push(rect(x-NX-1.6,V2.jawPin.z-3.1,x-NX+1.6,V2.jawPin.z+3.1).reverse()));
  V2.eyePin.x.forEach(x=>holes.push(rect(x-NX-1.6,V2.eyePin.z-3.1,x-NX+1.6,V2.eyePin.z+3.1).reverse()));
  V2.skullPlateY.forEach(y=>A.headLift.add(plateXZ(skullPts,V2.skullT,y-NY,MAT.bone,holes)));
  // 頭骨上的滑銷(下顎 ×2、眼球桿 ×2)
  PART='滑榫';   // 3×4 板材小榫,黏進頭骨主片的方孔;下顎/眼球桿的長槽掛在上面
  V2.jawPin.x.forEach(x=>A.headLift.add(
    plateYZ(rect(50-NY,V2.jawPin.z-3,64-NY,V2.jawPin.z+3),3,x-NX-1.5,MAT.plyDark)));
  V2.eyePin.x.forEach(x=>A.headLift.add(
    plateYZ(rect(50-NY,V2.eyePin.z-3,68-NY,V2.eyePin.z+3),3,x-NX-1.5,MAT.plyDark)));
  // 頸脊與頭骨的接合塊
  PART='頸脊接合塊';
  A.headLift.add(plateXZ(rect(-10,S.z0+9,10,S.z0+35),3,63-NY,MAT.plyDark));

  // 下顎:本體 + 兩支「升支」(帶滑槽) + 受推板(U 形讓開頸脊)
  A.jaw=new THREE.Group(); A.headPivot.add(A.jaw);
  const jx=S.sx-30-NX, jz=V2.jawZ0-3;                      // 顎局部 y=3 → z=jawZ0
  PART='下顎';
  const JT=[[83,88],[92,97]];     // 榫耳:長在碗底最低處(z≈122),那裡才有實料
  const EAR=[[71,81],[99,109]];   // 升支:往上長,開滑槽套在頭骨的 Ø4 銷上
  let jawPoly=PROFILES.jaw.map(p=>[p[0]+jx,p[1]+jz]);
  JT.forEach(([a,b])=>{jawPoly=addRect(jawPoly,a-NX,b-NX,V2.jawZ0-3,'bottom');});
  EAR.forEach(([a,b])=>{jawPoly=addRect(jawPoly,a-NX,b-NX,V2.jawZ0+60,'top');});
  A.jaw.add(plateXZ(jawPoly,V2.jawT,V2.jawY-NY,MAT.jaw,
    V2.jawPin.x.map(x=>rect(x-NX-1.7,152,x-NX+1.7,179).reverse())));
  PART='下顎受推板';
  // T 形:前橫條伸到 x=100 套住榫耳,後臂只到 x=84 讓開頸脊
  A.jaw.add(plateXY([[62-NX,50-NY],[100-NX,50-NY],[100-NX,64-NY],[84-NX,64-NY],
                     [84-NX,90-NY],[62-NX,90-NY]],3,V2.jawZ0-3,MAT.jaw,
    JT.map(([a,b])=>rect(a-NX-0.1,53.9-NY,b-NX+0.1,60.1-NY).reverse())));

  // 眼球橫桿 + 眼珠 + 受推板
  A.eyeBar=new THREE.Group(); A.headPivot.add(A.eyeBar);
  PART='眼球橫桿';
  // 左端下伸到 z=164 讓榫孔四周都有料;主體下緣一律 z=171,不會擋到推桿
  A.eyeBar.add(plateXZ([[38-NX,164],[50-NX,164],[50-NX,171],[124-NX,171],[124-NX,196],[38-NX,196]],
    V2.eyeBarT,V2.eyeBarY-NY,MAT.plyDark,
    V2.eyePin.x.map(x=>rect(x-NX-1.7,173,x-NX+1.7,193).reverse())
      .concat([rect(40.9-NX,170.9,47.1-NX,174.1).reverse()])));   // 榫孔
  [78,102].forEach(x=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(V2.eyeballR+0.6,20,14),MAT.eye);
    e.position.set(x-NX,187,V2.eyeBarY-NY-1.5); A.eyeBar.add(e);   // +5 讓眼珠在眼窩裡上下對稱跑
  });
  PART='眼球受推板';   // 板 + 榫是同一片
  A.eyeBar.add(plateXY([[38-NX,66-NY],[41-NX,66-NY],[41-NX,63-NY],[47-NX,63-NY],[47-NX,66-NY],
                        [70-NX,66-NY],[70-NX,92-NY],[38-NX,92-NY]],3,171,MAT.plyDark));


  G.userData.A=A; return G;
}

// ================= 原始圖面 =================
function buildOrig(){
  PART='原始圖面';
  const G=new THREE.Group(); const A={};
  const B=ORIG.box,T=B.t;
  G.add(plateXY(rect(0,0,B.w,B.d),T,-T,MAT.plyDark));
  G.add(plateXZ(rect(0,0,B.w,B.h),T,0,MAT.shell,[circPts(150,25,4,20).reverse()]));   // 前板 Ø8 手把孔(位置錯)
  G.add(plateXZ(rect(0,0,B.w,B.h),T,B.d-T,MAT.shell));
  G.add(plateYZ(rect(0,0,B.d,B.h),T,0,MAT.shell));      // 側板 114 滿深(接合過切)
  G.add(plateYZ(rect(0,0,B.d,B.h),T,B.w-T,MAT.shell));
  const slots=[[57],[82],[107]].map(([x])=>rect(x-2,50,x+2,66).reverse());
  slots.push(rect(120,50,136,54).reverse());
  slots.push(circPts(90,90,4,22).reverse());
  G.add(plateXY(rect(0,0,B.w,B.d),T,B.h,MAT.shell,slots));

  A.shaft=new THREE.Group(); A.shaft.position.set(0,ORIG.shaftZ,ORIG.shaftY); G.add(A.shaft);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(3,3,200,20),MAT.steel);
  sh.rotation.z=Math.PI/2; sh.position.x=90; A.shaft.add(sh);

  A.cams={};
  A.cams.jaw=camGroup(PROFILES.cam1,57,ORIG.shaftY,ORIG.shaftZ);G.add(A.cams.jaw);
  A.cams.nod=camGroup(eccPts(22,8),82,ORIG.shaftY,ORIG.shaftZ,MAT.bad);G.add(A.cams.nod);  // 會刮底板
  A.cams.eye=camGroup(PROFILES.cam4,107,ORIG.shaftY,ORIG.shaftZ);G.add(A.cams.eye);
  A.cams.turn=camGroup(circPts(0,0,20,40),128,ORIG.shaftY,ORIG.shaftZ,MAT.turn);G.add(A.cams.turn);
  A.turnPin=new THREE.Group(); A.turnPin.position.set(0,ORIG.shaftZ,ORIG.shaftY); G.add(A.turnPin);
  A.turnPin.add(rodX(2,10,128,12,0,MAT.bad).translateY(0));
  A.turnPin.children[0].position.set(128,0,12); // 沿凸輪半徑 12 的銷(暫置,更新時再擺)

  function fol(x,len,mat){const g=new THREE.Group();
    g.add(plateYZ(rect(51,0,63,len),3,x-1.5,mat||MAT.rod));return g;}
  A.jawRod=fol(57,ORIG.followers.jaw); G.add(A.jawRod);
  A.nodRod=fol(82,ORIG.followers.nod); G.add(A.nodRod);
  A.eyeRod=fol(107,ORIG.followers.eye);G.add(A.eyeRod);

  A.lift=new THREE.Group();
  A.lift.add(plateXY(rect(62,45,102,69),3,0,MAT.bad));   // 點頭升降板 40×24
  G.add(A.lift);

  A.eyeBar=new THREE.Group();
  A.eyeBar.add(plateXZ(rect(71,0,143,10),3,52,MAT.plyDark)); G.add(A.eyeBar);

  // 頭:掛在頂板 Ø8 頸柱孔 (90,90) 上,頸長圖面沒給,取 40mm
  A.head=new THREE.Group(); G.add(A.head);
  const ox=90-42, oz=93+40-9;
  A.head.add(plateXZ(PROFILES.skull.map(p=>[p[0]+ox,p[1]+oz]),3,88,MAT.bone,
    [circPts(30+ox,66+oz,11,26).reverse(),circPts(54+ox,66+oz,11,26).reverse()]));
  A.head.add(plateXZ(PROFILES.skull.map(p=>[p[0]+ox,p[1]+oz]),3,94,MAT.bone,
    [circPts(30+ox,66+oz,11,26).reverse(),circPts(54+ox,66+oz,11,26).reverse()]));
  const jx=90-30, jz=(93+40+17-9)-28;
  A.head.add(plateXZ(PROFILES.jaw.map(p=>[p[0]+jx,p[1]+jz]),6,88,MAT.jaw));
  A.head.add(rodZ(4,40,90,90,93+20,MAT.plyDark));
  // 頸柱轉盤
  A.tt=new THREE.Group(); A.tt.position.set(90,96,90);
  const hub=new THREE.Mesh(extrude(mkShape(circPts(0,0,20,32),[circPts(0,0,3,18).reverse()]),3),MAT.turn);
  hub.rotation.x=Math.PI/2; hub.position.y=1.5; A.tt.add(hub);
  PART='轉盤';reg(hub,circPts(0,0,V2.turntable.hubR,26),[rect(-4.3,-3.3,4.3,3.3).reverse()],3);
  A.tt.add(rodZ(2,10,14,0,0,MAT.bad));
  G.add(A.tt);

  // 轉頭連桿:用一條「會變長」的紅棒表示 —— 剛性連桿在此無解
  A.link=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,1,12),MAT.bad); G.add(A.link);

  G.userData.A=A; return G;
}

// ================= 更新 =================
function updV2(A,th){
  const s=stateV2(th);
  A.shaft.rotation.x=-th;
  A.cams.eye.rotation.x =-(th+V2.cams.eye.phase*D2R);
  A.cams.jaw.rotation.x =-(th+V2.cams.jaw.phase*D2R);
  A.cams.turn.rotation.x=-(th+V2.cams.turn.phase*D2R);
  A.cams.nod.rotation.x =-(th+V2.cams.nod.phase*D2R);
  A.eyeRod.position.y = V2.shaftZ + s.rEye;
  A.jawRod.position.y = V2.shaftZ + s.rJaw;
  A.turnPlate.position.y = s.turnPlateZ;
  A.lift.position.y = s.liftZ;
  A.neck.position.y = s.liftZ + V2.lift.t;
  A.tt.rotation.y = -s.turnAng;
  A.neck.rotation.y = -s.turnAng;
  A.headPivot.rotation.y = -s.turnAng;
  A.headLift.position.y = s.nod;
  A.jaw.position.y = s.jawRodTop - (V2.shaftZ + V2.rng.jaw.max + V2.jawRodLen);
  A.eyeBar.position.y = s.eyeRodTop - (V2.shaftZ + V2.rng.eye.max + V2.eyeRodLen);
  return s;
}
function updOrig(A,th){
  const s=stateOrig(th);
  A.shaft.rotation.x=-th;
  A.cams.jaw.rotation.x =-(th+ORIG.cams.jaw.phase*D2R);
  A.cams.nod.rotation.x =-(th+ORIG.cams.nod.phase*D2R);
  A.cams.eye.rotation.x =-(th+ORIG.cams.eye.phase*D2R);
  A.cams.turn.rotation.x=-(th+ORIG.cams.turn.phase*D2R);
  A.turnPin.rotation.x  =-(th+ORIG.cams.turn.phase*D2R);
  A.jawRod.position.y = ORIG.shaftZ+s.rJaw;
  A.nodRod.position.y = ORIG.shaftZ+s.rNod;
  A.eyeRod.position.y = ORIG.shaftZ+s.rEye;
  A.lift.position.y   = s.nodTop-3;
  A.eyeBar.position.y = s.eyeTop-10;
  // 連桿:偏心銷 → 轉盤銷(轉盤固定不動,因為它根本轉不動)
  const p=new THREE.Vector3(s.pin.x,s.pin.z,s.pin.y);
  const q=new THREE.Vector3(90+14,99,90);
  const mid=p.clone().add(q).multiplyScalar(.5), len=p.distanceTo(q);
  A.link.position.copy(mid);
  A.link.scale.set(1,len,1);
  A.link.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),q.clone().sub(p).normalize());
  s.linkLen=len;
  return s;
}

// ================= UI =================
let mode='v2', playing=true, th=0, speed=60;
const gV2=buildV2(), gOrig=buildOrig();
scene.add(gV2); scene.add(gOrig); gOrig.visible=false;

const LEGEND={
  v2:`<span class="sw" style="background:#e4713a"></span>凸輪 &nbsp;<span class="sw" style="background:#7aa2f7"></span>推桿 &nbsp;<span class="sw" style="background:#c678dd"></span>轉頭組 &nbsp;<span class="sw" style="background:#f0ece0"></span>頭骨<br>
  眼球=雙凸(每轉兩次)、下顎=水滴、點頭=偏心圓、轉頭=偏心圓+45°斜槽`,
  orig:`<span class="sw" style="background:#ff5252"></span>= 出問題的零件。紅棒是「轉頭連桿」,它的長度會隨曲柄一直變 —— 那正是它做不出來的原因。`
};
function renderChecks(){
  const list = mode==='v2'?checksV2():checksOrig();
  document.getElementById('chkTitle').textContent = mode==='v2'?'修正版 · 檢查結果':'原始圖面 · 問題清單';
  document.getElementById('legend').innerHTML = LEGEND[mode];
  document.getElementById('dofWrap').hidden = (mode!=='v2');
  if(mode==='v2') document.getElementById('dof').innerHTML = DOF.map(g=>
    `<div class="chk ok" style="border-left-color:#7aa2f7"><b>${g.p}</b>`+
    g.rows.map(([d,k,t])=>{
      const col={form:'var(--ok)',force:'var(--warn)',drive:'var(--acc)',note:'var(--dim)','form/force':'var(--ok)'}[k]||'var(--dim)';
      return `<div class="v" style="margin-top:3px"><span style="color:${col};display:inline-block;min-width:112px">${d}</span>`+
             `<span style="color:${col};font-size:10px">[${k}]</span> ${t}</div>`;}).join('')+'</div>').join('');
  document.getElementById('checks').innerHTML = list.map(c=>
    `<div class="chk ${c.ok?'ok':'bad'}"><span class="tag">${c.ok?'PASS':'FAIL'}</span><b>${c.t}</b>
     <div class="v">${c.v}</div>${c.why?`<div class="why">${c.why}</div>`:''}</div>`).join('');
}
function setMode(m){
  mode=m; gV2.visible=(m==='v2'); gOrig.visible=(m==='orig');
  document.getElementById('mV2').classList.toggle('on',m==='v2');
  document.getElementById('mOrig').classList.toggle('on',m==='orig');
  renderChecks();
}
document.getElementById('mV2').onclick=()=>setMode('v2');
document.getElementById('mOrig').onclick=()=>setMode('orig');
const btn=document.getElementById('play');
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'⏸ 暫停':'▶ 播放';};
document.getElementById('spd').oninput=e=>{speed=+e.target.value;document.getElementById('spdv').textContent=speed;};
document.getElementById('ang').oninput=e=>{playing=false;btn.textContent='▶ 播放';th=(+e.target.value)*D2R;};

const live=document.getElementById('live');
function hud(s){
  if(NO3D||!live) return;
  if(mode==='v2'){
    live.innerHTML=
      `<span class="k">曲柄</span>${fmt(th/D2R,0)}°<br>`+
      `<span class="k">下顎開</span>${fmt(V2.shaftZ+V2.rng.jaw.max+V2.jawRodLen-s.jawRodTop+s.nod)} mm<br>`+
      `<span class="k">點頭</span>${fmt(s.nod)} mm<br>`+
      `<span class="k">眼球</span>${fmt(s.eyeRodTop-(V2.shaftZ+V2.rng.eye.min+V2.eyeRodLen))} mm<br>`+
      `<span class="k">轉頭</span>${fmt(s.turnAng/D2R)}°`;
  }else{
    const gap=ORIG.shaftZ-(22+8*Math.cos(th+ORIG.cams.nod.phase*D2R))*0+ (ORIG.shaftZ - (22+8*Math.cos(th+Math.PI+ORIG.cams.nod.phase*D2R)));
    live.innerHTML=
      `<span class="k">曲柄</span>${fmt(th/D2R,0)}°<br>`+
      `<span class="k">轉頭連桿</span><span style="color:#ff6b6b">${fmt(s.linkLen)} mm ← 一直在變</span><br>`+
      `<span class="k">升降板</span>z=${fmt(s.nodTop-3)}(頂板 93)<br>`+
      `<span class="k">②凸輪底</span>z=${fmt(ORIG.shaftZ-30)} ← 刮底板`;
  }
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(playing) th=(th+speed*D2R*dt)%(Math.PI*2);
  document.getElementById('ang').value=Math.round(th/D2R)%360;
  document.getElementById('angv').textContent=Math.round(th/D2R)+'°';
  const s = mode==='v2' ? updV2(gV2.userData.A,th) : updOrig(gOrig.userData.A,th);
